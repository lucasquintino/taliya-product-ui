schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Full SDD Planning Cycle"
  version: "2.0.0"
  author: "Taliya"
  description: "Runs specify, clarify, plan, tasks, checklist, and analyze; stops for explicit implementation approval"

requires:
  speckit_version: ">=0.7.2"
  integrations:
    any: ["codex", "copilot", "claude", "gemini"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "codex"
    prompt: "Integration to use (for example codex, claude, copilot, or gemini)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review scope, stories, requirements, edge cases, and measurable outcomes before clarification."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-clarifications
    type: gate
    message: "Confirm that no material ambiguity or NEEDS CLARIFICATION marker remains."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review research, model, contracts, risks, architecture, and rollout before task generation."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "Verify requirements quality, SDD readiness, and implementation preconditions."

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Cross-check constitution, spec, plan, contracts, tasks, and traceability."

  - id: review-sdd
    type: gate
    message: "The planning workflow intentionally stops here. Record explicit human approval before any implementation command or product-code change."
    options: [approve-for-implementation, reject]
    on_reject: abort
