name: Library portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-clone:
    name: Clean clone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Enable pinned package manager
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate

      - name: Install frozen workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Install PR browser
        run: corepack pnpm exec playwright install chromium

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Test official packages
        run: corepack pnpm --filter @taliya/tokens test && corepack pnpm --filter @taliya/ui test && corepack pnpm --filter @taliya/crm test

      - name: Enforce package coverage thresholds
        run: corepack pnpm coverage

      - name: Build packages and static Storybook
        run: corepack pnpm build

      - name: Pack current packages
        run: corepack pnpm pack:local

      - name: Audit package artifacts
        run: corepack pnpm package-artifacts:audit

      - name: Install synthetic future consumer
        run: corepack pnpm future-consumer-fixture:audit

      - name: Run deterministic quality gates
        run: |
          corepack pnpm quality:governance
          corepack pnpm tokens:audit
          corepack pnpm storybook-anatomy:audit:strict
          corepack pnpm components:audit
          corepack pnpm crm-module-boundaries:audit
          corepack pnpm domain-wrappers:audit
          corepack pnpm package-boundaries:audit
          corepack pnpm public-api:audit
          corepack pnpm public-api-surface:audit
          corepack pnpm source-assets:audit
          corepack pnpm source-assets:reconcile
          corepack pnpm registry-publication:audit
          corepack pnpm registry-consumer-adoption:audit
          node scripts/quality/run-story-tests.mjs --storybook-dir apps/docs/storybook-static
          node scripts/quality/run-story-interactions.mjs --storybook-dir apps/docs/storybook-static --workers 16
          corepack pnpm e2e:pr
          node scripts/quality/audit-dependencies.mjs --prod
          node scripts/quality/audit-dependencies.mjs --full
          node scripts/quality/run-sast.mjs
          node scripts/quality/run-secrets.mjs

      - name: Reject stale artifacts and reports
        run: corepack pnpm pack:local:stale-artifact-probe && corepack pnpm report-freshness:audit:stale-probe

      - name: Prove checks are read-only
        run: corepack pnpm audit-checks:read-only-probe

      - name: Upload Storybook build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-static
          path: apps/docs/storybook-static
          if-no-files-found: error
