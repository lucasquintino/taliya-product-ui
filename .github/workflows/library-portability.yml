name: Library portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-clone:
    name: Clean clone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 9.15.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Install PR browser
        run: pnpm exec playwright install chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test official packages
        run: pnpm --filter @taliya/tokens test && pnpm --filter @taliya/ui test && pnpm --filter @taliya/crm test

      - name: Enforce package coverage thresholds
        run: pnpm coverage

      - name: Build packages and static Storybook
        run: pnpm build

      - name: Pack current packages
        run: pnpm pack:local

      - name: Audit package artifacts
        run: pnpm package-artifacts:audit

      - name: Install synthetic future consumer
        run: pnpm future-consumer-fixture:audit

      - name: Run deterministic quality gates
        run: node scripts/quality/run-portability-gates.mjs

      - name: Run portable browser and security gates
        run: |
          node scripts/quality/run-story-tests.mjs --storybook-dir apps/docs/storybook-static
          node scripts/quality/run-story-interactions.mjs --storybook-dir apps/docs/storybook-static --workers 4
          pnpm a11y:evidence
          pnpm e2e:pr
          node scripts/quality/audit-dependencies.mjs --prod
          node scripts/quality/audit-dependencies.mjs --full
          node scripts/quality/run-sast.mjs
          node scripts/quality/run-secrets.mjs

      - name: Reject stale artifacts and reports
        run: pnpm pack:local:stale-artifact-probe && pnpm report-freshness:audit:stale-probe

      - name: Prove checks are read-only
        run: pnpm audit-checks:read-only-probe

      - name: Upload Storybook build
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-static
          path: apps/docs/storybook-static
          if-no-files-found: error
