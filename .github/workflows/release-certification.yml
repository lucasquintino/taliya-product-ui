name: Release certification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: npm-trusted-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build distributable declarations for public API gates
        run: pnpm build
      - name: Run governance and source-of-truth gates
        run: node scripts/quality/run-portability-gates.mjs --release
      - run: pnpm exec playwright install chromium firefox webkit
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - run: pnpm coverage
      - run: pnpm storybook:build
      - run: node scripts/quality/run-story-tests.mjs --storybook-dir apps/docs/storybook-static
      - run: node scripts/quality/run-story-interactions.mjs --storybook-dir apps/docs/storybook-static --workers 4
      - run: pnpm a11y:evidence
      - run: node scripts/quality/capture-storybook.mjs --storybook-dir apps/docs/storybook-static --output-dir artifacts/visual/captures --report artifacts/visual/capture-report.json --timeout 30000
      - run: node scripts/quality/audit-story-runtime.mjs --capture-report artifacts/visual/capture-report.json
      - run: node scripts/quality/compare-visuals.mjs --approved-render-hash
      - run: node scripts/quality/validate-visual-approvals.mjs
      - run: node scripts/quality/run-release-e2e.mjs
      - run: pnpm pack:local
      - run: pnpm local-release-manifest:audit
      - name: Generate SBOM for the exact dependency lockfile
        run: pnpm dlx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file artifacts/release/sbom.json --spec-version 1.5
      - name: Hash the exact publishable tarballs and SBOM
        run: node scripts/quality/hash-release-artifacts.mjs
      - run: pnpm consumer:packed-audit
      - run: node scripts/quality/audit-package-performance.mjs
      - run: node scripts/quality/record-final-waiver-audit.mjs
      - run: node scripts/quality/record-security-evidence.mjs
      - run: node scripts/quality/record-performance-gate.mjs
      - run: node scripts/quality/record-provenance-evidence.mjs
      - run: node scripts/quality/certify-release.mjs
      - name: Upload exact certified artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-certified-artifacts
          path: |
            dist-packages/*.tgz
            artifacts/release/**
          if-no-files-found: error
