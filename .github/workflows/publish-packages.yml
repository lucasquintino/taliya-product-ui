name: Publish packages

on:
  workflow_dispatch:
    inputs:
      certification_run_id:
        description: GitHub Actions run ID that produced release-certified-artifacts for this commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-trusted-publish
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Download exact certified artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: release-certified-artifacts
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
      - name: Verify exact certified handoff
        run: node scripts/quality/verify-release-handoff.mjs
      - name: Publish exact certified tarballs through npm trusted publishing
        run: corepack pnpm release:npm:artifacts
        env:
          NPM_CONFIG_PROVENANCE: "true"
