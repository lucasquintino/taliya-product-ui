name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-trusted-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Enable pinned package manager
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm build
      - run: corepack pnpm pack:local
      - run: corepack pnpm package-artifacts:audit
      - run: corepack pnpm future-consumer-fixture:audit
      - name: Hash publishable artifacts
        run: sha256sum dist-packages/*.tgz > dist-packages/SHA256SUMS
      - name: Publish through npm trusted publishing
        run: corepack pnpm release:npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
