name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Canonical change profile
        required: false
        default: governance
      stage:
        description: Gate stage
        required: false
        default: pr

jobs:
  select-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QUALITY_PROFILE: ${{ inputs.profile || 'governance' }}
      QUALITY_STAGE: ${{ inputs.stage || 'pr' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm quality:select --profile "$QUALITY_PROFILE" --stage "$QUALITY_STAGE"
      - run: pnpm quality:governance
      - run: pnpm coverage
      - run: pnpm storybook:build
      - run: node scripts/quality/run-story-tests.mjs --storybook-dir apps/docs/storybook-static
      - run: node scripts/quality/run-story-interactions.mjs --storybook-dir apps/docs/storybook-static --workers 4
      - run: pnpm a11y:evidence
      - name: Capture package-wave visual evidence
        if: env.QUALITY_PROFILE == 'ui-component' || env.QUALITY_PROFILE == 'crm-component' || env.QUALITY_PROFILE == 'full'
        run: node scripts/quality/capture-storybook.mjs --storybook-dir apps/docs/storybook-static --output-dir artifacts/visual/captures --report artifacts/visual/capture-report.json --timeout 30000
      - name: Compare package-wave visuals
        if: env.QUALITY_PROFILE == 'ui-component' || env.QUALITY_PROFILE == 'crm-component' || env.QUALITY_PROFILE == 'full'
        run: node scripts/quality/compare-visuals.mjs
      - name: Validate package-wave visual approvals
        if: env.QUALITY_PROFILE == 'ui-component' || env.QUALITY_PROFILE == 'crm-component' || env.QUALITY_PROFILE == 'full'
        run: node scripts/quality/validate-visual-approvals.mjs
      - name: Run Wave 5 UI checkpoint
        if: env.QUALITY_PROFILE == 'ui-component' || env.QUALITY_PROFILE == 'full'
        run: pnpm wave5:evidence
      - name: Run Wave 6 CRM checkpoint
        if: env.QUALITY_PROFILE == 'crm-component' || env.QUALITY_PROFILE == 'full'
        run: pnpm wave6:evidence
      - run: node scripts/quality/run-sast.mjs
      - run: node scripts/quality/run-secrets.mjs
